# ehbien_lotto_admin/pubspec.yaml

name: ehbien_lotto_admin
description: "Dashboard administrateur — Ehbien Lotto"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons:      ^1.0.8

  # ── Firebase ──────────────────────────────────────────────
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore:      ^5.4.4
  firebase_storage:     ^12.3.2

  # ── State management ──────────────────────────────────────
  flutter_riverpod:     ^2.5.1
  riverpod_annotation:  ^2.3.5

  # ── Routing ───────────────────────────────────────────────
  go_router:            ^14.2.7

  # ── Models / sérialisation ────────────────────────────────
  freezed_annotation:   ^2.4.4
  json_annotation:      ^4.9.0
  equatable:            ^2.0.5

  # ── Functional programming ────────────────────────────────
  dartz:                ^0.10.1

  # ── UI / Charts ───────────────────────────────────────────
  fl_chart:             ^0.69.0
  data_table_2:         ^2.5.14

  # ── Internationalisation ──────────────────────────────────
  intl:                 ^0.19.0

  # ── Utils ─────────────────────────────────────────────────
  uuid:                 ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:        ^4.0.0

  # ── Code generation ───────────────────────────────────────
  build_runner:         ^2.4.13
  freezed:              ^2.5.7
  json_serializable:    ^6.8.0
  riverpod_generator:   ^2.4.3

  # ── Linting ───────────────────────────────────────────────
  custom_lint:          ^0.7.3      # ← version corrigée
  riverpod_lint:        ^2.6.3      # ← version corrigée

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/